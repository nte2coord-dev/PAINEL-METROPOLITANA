# Blueprint do Render: Web Service (Node) + PostgreSQL gerenciado.
# Crie em: Render > New > Blueprint > aponte para este repositório.
services:
  - type: web
    name: painel-sre-metropolitana-a
    runtime: node
    plan: starter            # "free" funciona, mas dorme após inatividade
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: painel-db
          property: connectionString
databases:
  - name: painel-db
    plan: basic-256mb        # o plano "free" do Postgres expira em 30 dias
    databaseName: painel
